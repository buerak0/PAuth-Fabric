// Central build script: Stonecutter applies it to every version under versions/.
// Version-specific values come from versions/<version>/gradle.properties.
plugins {
    // Last Loom line that still remaps: these Minecraft versions ship obfuscated.
    // Note the plugin id: 1.13 publishes the marker as 'fabric-loom', not
    // 'net.fabricmc.fabric-loom' the way 1.17 on main does.
    id 'fabric-loom' version '1.13.6'
    id 'dev.kikugie.stonecutter'
}

version = "${project.mod_version}+${project.minecraft_version}"
group = project.mod_group_id

base {
    archivesName = "${project.mod_id}-fabric-${project.minecraft_version}"
}

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
        content { includeGroupByRegex 'net\\.fabricmc.*' }
    }
    mavenCentral()
}

dependencies {
    minecraft "com.mojang:minecraft:${project.minecraft_version}"
    // The sources are written in Mojang names and these versions are obfuscated, so the
    // official mappings have to be asked for explicitly.
    mappings loom.officialMojangMappings()
    modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

    // Only the Fabric API modules PAuth actually uses, rather than the whole umbrella.
    [
            'fabric-api-base',
            'fabric-command-api-v2',
            'fabric-lifecycle-events-v1',
            'fabric-events-interaction-v0',
            'fabric-message-api-v1',
            'fabric-networking-api-v1',
    ].each { module ->
        modImplementation fabricApi.module(module, project.fabric_version)
    }
}

def javaVersion = Integer.parseInt(project.java_version)

processResources {
    inputs.property "version", project.version
    inputs.property "minecraft_version", project.minecraft_version
    inputs.property "loader_version", project.loader_version
    inputs.property "java_version", project.java_version

    filesMatching(["fabric.mod.json", "pauth.mixins.json"]) {
        expand(
                "version": project.version,
                "minecraft_version": project.minecraft_version,
                "loader_version": project.loader_version,
                "java_version": project.java_version
        )
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = javaVersion
    it.options.encoding = "UTF-8"
}

java {
    withSourcesJar()
    toolchain {
        languageVersion = JavaLanguageVersion.of(javaVersion)
    }
}

jar {
    from(rootProject.file("LICENSE")) {
        rename { "${it}_${project.base.archivesName.get()}" }
    }
}

// Collect every version's jar in one place so a full build leaves a usable set.
// remapJar is the shipped artifact here; matching/configureEach stays lazy because Loom
// registers that task after this script runs.
tasks.matching { it.name == 'remapJar' }.configureEach {
    destinationDirectory = rootProject.layout.buildDirectory.dir('libs')
}
