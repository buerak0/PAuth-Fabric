pluginManagement {
    repositories {
        // Each third-party repo is pinned to its own group. Without this Gradle asks every
        // repository for every transitive artifact (gson, kotlin-metadata, ...), which is
        // slow at best and fails the build when one of them is unreachable.
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
            content {
                includeGroupByRegex 'net\\.fabricmc.*'
                // Loom 1.13 publishes its plugin marker under the bare 'fabric-loom' group,
                // which the net.fabricmc filter above would hide.
                includeGroup 'fabric-loom'
            }
        }
        maven {
            name = 'Stonecutter'
            url = 'https://maven.kikugie.dev/releases'
            content { includeGroupByRegex 'dev\\.kikugie.*' }
        }
        gradlePluginPortal()
        mavenCentral()
    }
}

plugins {
    id 'dev.kikugie.stonecutter' version '0.9.8'
    // Lets Gradle fetch the JDK a version needs (17 for 1.20.1, 21 for 1.21.x)
    // instead of failing on a machine that only has one installed.
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

stonecutter {
    create(rootProject) {
        // The obfuscated era. These versions need a Loom that still remaps (1.13 here);
        // the Loom on main is built for non-obfuscated Minecraft and cannot consume a
        // 1.21.x Fabric API artifact at all. A Gradle build resolves its plugin classpath
        // once, so 26.x cannot share this tree - it stays on main.
        versions '1.21.1', '1.21.4', '1.21.8'
        vcsVersion = '1.21.8'
    }
}

rootProject.name = 'PAuth'
